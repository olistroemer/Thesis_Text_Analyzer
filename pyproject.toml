[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "tta"
version = "0.1.0"
description = "Thesis Text Analyzer — per-thesis text metrics and their evolution over publication date"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Core stays dependency-light (QA-RES); analysis libraries per SDD §7.1 /
# ADR-0011 library-choice policy.
dependencies = [
    "langdetect>=1.0.9",  # mod_classify_language
    "nltk>=3.9",          # mod_tokenize (punkt_tab; data bundled at release per ADR-0014)
    "textstat>=0.7.4",    # mod_readability (Flesch en / Amstad de)
    "pypdf>=5.0",         # mod_count_images, mod_extract_pdf_metadata
    "click>=8.1",         # cli (ADR-0003)
    "rich>=13",           # cli tables + markdown help rendering (ADR-0012)
    "tomli-w>=1.0",       # tta.toml writer (reading uses stdlib tomllib)
    "tksheet>=7.5",       # data grid with per-cell styling (ADR-0001)
    "matplotlib>=3.8",    # report view charts (ADR-0016)
]

[project.scripts]
tta = "tta.cli.main:main"

[project.gui-scripts]
tta-gui = "tta.ui.tk.app:main"

[project.optional-dependencies]
# PyMuPDF is AGPL — development-phase extractor only. The release gate
# (ADR-0011 / ADR-0014) fails any distributed build that imports it under
# tta/core/. Kept out of the default dependency set on purpose.
pymupdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "tta[pymupdf]"]
# Frozen single-file binaries (ADR-0014). PyInstaller --onefile; punkt_tab
# NLTK data + SQL migrations bundled via the committed packaging/tta.spec.
build = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
include = ["tta*"]

[tool.setuptools.package-data]
"tta.core.db" = ["migrations/*.sql"]
"tta.core" = ["help/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-pipeline tests over real PDFs"]
