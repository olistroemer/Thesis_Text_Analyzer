[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license expression
build-backend = "setuptools.build_meta"

[project]
name = "tta"
version = "0.1.0"
description = "Thesis Text Analyzer — per-thesis text metrics and their evolution over publication date"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
# Core stays dependency-light (QA-RES); analysis libraries per SDD §7.1 /
# ADR-0011 library-choice policy.
dependencies = [
    "langdetect>=1.0.9",  # mod_classify_language
    "nltk>=3.9",          # mod_tokenize (punkt_tab; data bundled at release per ADR-0014)
    "textstat>=0.7.4,<0.8",  # <0.8: it auto-downloads NLTK cmudict (#75)    # mod_readability (Flesch en / Amstad de)
    "pypdf>=5.0",         # mod_count_images, mod_extract_pdf_metadata
    "click>=8.1",         # cli (ADR-0003)
    "rich>=13",           # cli tables + markdown help rendering (ADR-0012)
    "tomli-w>=1.0",       # tta.toml writer (reading uses stdlib tomllib)
    "tksheet>=7.5",       # data grid with per-cell styling (ADR-0001)
    # PyMuPDF (AGPL, shipped under ADR-0017): the default extractor
    # (mod_extract_pymupdf). <2: 2.x hard-requires numpy/onnxruntime/
    # pymupdf4llm (ADR-0014).
    "pymupdf>=1.24,<2",
]

# Source-availability pointer for the copyleft licence (ADR-0017, #71);
# the same URL is shown in the GUI About window and pinned by a test.
[project.urls]
Homepage = "https://github.com/olistroemer/Thesis_Text_Analyzer"
Source = "https://github.com/olistroemer/Thesis_Text_Analyzer"
Issues = "https://github.com/olistroemer/Thesis_Text_Analyzer/issues"

[project.scripts]
tta = "tta.cli.main:main"

[project.gui-scripts]
tta-gui = "tta.ui.tk.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Frozen single-file binaries (ADR-0014). PyInstaller --onefile; punkt_tab
# NLTK data + SQL migrations bundled via the committed packaging/tta.spec.
# pip-licenses inventories the build environment for THIRD_PARTY_LICENSES.txt,
# which the spec refuses to build without (ADR-0014 licence manifest, #4).
build = ["pyinstaller>=6", "pip-licenses>=5"]

[tool.setuptools.packages.find]
include = ["tta*"]

[tool.setuptools.package-data]
"tta.core.db" = ["migrations/*.sql"]
"tta.core" = ["help/**/*.md"]
"tta" = ["locale/*/LC_MESSAGES/*.mo", "locale/*.pot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-pipeline tests over real PDFs"]
