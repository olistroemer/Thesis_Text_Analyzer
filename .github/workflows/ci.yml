name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: lint-and-test (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # python3-tk pulls in the libtcl/libtk shared objects the setup-python
      # interpreter's tkinter links against; xvfb gives the display-gated GUI
      # tests somewhere to draw (see the GUI step below).
      - name: Install Tk and Xvfb (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      # pytest-cov is installed here rather than declared in the dev extra:
      # it is a property of how CI measures the suite, not of the package.
      # pip-licenses (the build extra) comes along so tests/packaging can
      # exercise the real manifest generator instead of skipping it.
      - name: Install package (dev extras + coverage)
        run: |
          pip install -e '.[dev,build]' 'pytest-cov>=5'
          python -m nltk.downloader punkt_tab

      # SDD §5.2 — hexagonal boundary invariant.
      # core/cli must not import the UI layer; core/ui must not import the CLI
      # layer. A match means the dependency direction was violated.
      # (No AGPL gate — retired by ADR-0017.)
      - name: Boundary invariant (SDD §5.2)
        run: |
          if grep -rn 'tta\.ui' tta/core tta/cli --include='*.py'; then
            echo "::error::tta.core/tta.cli must not import tta.ui (SDD §5.2)"
            exit 1
          fi
          if grep -rn 'tta\.cli' tta/core tta/ui --include='*.py'; then
            echo "::error::tta.core/tta.ui must not import tta.cli (SDD §5.2)"
            exit 1
          fi

      # ADR-0018 — Python source must be pure ASCII.
      - name: ASCII-source invariant (ADR-0018)
        run: |
          if git ls-files '*.py' | xargs grep -lP '[^\x00-\x7F]'; then
            echo "::error::non-ASCII byte found in tracked *.py (ADR-0018)"
            exit 1
          fi

      # Includes the slow-marked tests (full pipeline, GUI smoke) - nothing
      # deselects them. The display-gated GUI tests self-skip here; the step
      # after this one runs them for real under Xvfb.
      #
      # Coverage gate (QA-TEST, SDD §10): 85 % line AND 70 % branch on
      # tta/core - two separate targets, which is why this cannot use
      # --cov-fail-under. That flag gates coverage.py's single COMBINED
      # line+branch rate, so it would fail a build that satisfies both stated
      # targets (line 86 %, branch 71 % combine to ~81 %) and pass one that
      # misses the branch target outright. The two numbers are therefore
      # checked separately, against the ones QA-TEST states.
      #
      # COVERAGE_FILE and the JSON report are written outside the checkout, so
      # a coverage run leaves the working tree clean.
      - name: Run tests (with the QA-TEST coverage gate)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          TTA_COV_LINE: "85"
          TTA_COV_BRANCH: "70"
        run: |
          set -euo pipefail
          python -m pytest -q \
            --cov=tta.core --cov-branch --cov-report=term-missing \
            --cov-report=json:"$RUNNER_TEMP/coverage.json"
          python - <<'PY'
          import json, os, sys

          totals = json.load(
              open(os.path.join(os.environ["RUNNER_TEMP"], "coverage.json"))
          )["totals"]
          line = 100.0 * totals["covered_lines"] / max(totals["num_statements"], 1)
          branch = 100.0 * totals["covered_branches"] / max(totals["num_branches"], 1)
          want_line = float(os.environ["TTA_COV_LINE"])
          want_branch = float(os.environ["TTA_COV_BRANCH"])
          print(
              "tta/core coverage: %.2f %% line (QA-TEST target %.0f %%), "
              "%.2f %% branch (target %.0f %%)"
              % (line, want_line, branch, want_branch)
          )
          short = []
          if line < want_line:
              short.append("line %.2f %% < %.0f %%" % (line, want_line))
          if branch < want_branch:
              short.append("branch %.2f %% < %.0f %%" % (branch, want_branch))
          if short:
              print("::error::QA-TEST coverage gate: " + "; ".join(short))
              sys.exit(1)
          PY

      # Without this the display-gated tests under tests/ui NEVER run in CI -
      # they self-skip, which reads as a pass. Issue #3 allows either, but a
      # permanently skipped test is untested code. Kept as its own step so an
      # Xvfb problem is instantly distinguishable from a real failure.
      - name: GUI tests under Xvfb
        run: xvfb-run -a python -m pytest tests/ui -q

  # Frozen release binaries (issue #4, ADR-0014). Linux only - NO mac/win
  # matrix. Builds the two --onefile executables from packaging/tta.spec and
  # uploads them as a workflow artifact. PyMuPDF may ship (ADR-0017).
  #
  # ADR-0014 clean-environment clause (#52): PYTHONNOUSERSITE=1 is set for
  # the WHOLE job, so the user site directory can never contribute to the
  # frozen binary. The first 212 MB release build picked up llvmlite (168 MB
  # uncompressed) and numba (10 MB) from the builder's ~/.local that way -
  # neither is a declared dependency. The spec refuses to build without it.
  build-linux:
    name: build-linux (onefile)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      PYTHONNOUSERSITE: "1"
      # ...and pip must not install *into* the user site either, or the
      # freeze would not find the dependencies it just installed.
      PIP_USER: "0"
      # ADR-0014 size gate: per-executable ceiling, in bytes (150 MB).
      # A regression tripwire, not a target. Raising it requires an ADR
      # revision with a measurement - the reflex on a failure is to look
      # for undeclared packages in build/tta/Analysis-*.toc first.
      TTA_MAX_EXE_BYTES: "157286400"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tkinter is not bundled with the actions/setup-python interpreter; the
      # GUI binary (tta.ui.tk) needs it present at freeze time.
      - name: Install Tk (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      # build extra = PyInstaller; pymupdf extra = the fitz extractor the
      # default module registry uses (ADR-0017 permits shipping it).
      - name: Install build dependencies
        run: pip install -e '.[build,pymupdf]'

      - name: Download NLTK punkt_tab (bundled into the binary)
        run: python -m nltk.downloader punkt_tab

      # ADR-0014 licence manifest (#4). Must run BEFORE PyInstaller and in
      # this same clean environment: it inventories the installed
      # distributions, so its accuracy depends on PYTHONNOUSERSITE above.
      # The spec refuses to build if the file is absent.
      - name: Generate THIRD_PARTY_LICENSES.txt (ADR-0014)
        run: |
          python packaging/gen_third_party_licenses.py \
            --output build/licenses/THIRD_PARTY_LICENSES.txt

      - name: Build onefile binaries
        run: pyinstaller packaging/tta.spec --noconfirm --distpath dist --workpath build

      # ADR-0014 build gates (#52, #4): per-executable size ceiling, plus
      # proof that neither dependency graph carries the undeclared numeric
      # stack, that nothing was collected from a user site directory, that
      # the CLI graph is free of the GUI-only stack, and that every bundled
      # distribution has a licence notice in the manifest. The logic lives in
      # a committed script so it is unit-tested by tests/packaging/.
      - name: Build gates (ADR-0014)
        run: |
          python packaging/check_build.py \
            --dist dist --build build/tta --max-bytes "$TTA_MAX_EXE_BYTES" \
            --manifest build/licenses/THIRD_PARTY_LICENSES.txt

      # Headless CLI smoke test: prove the frozen binary boots, the bundled
      # SQL migrations run, and the NLTK-dependent modules succeed end to end
      # (issue #4). No DISPLAY here, so the GUI binary is not launched.
      - name: Smoke-test CLI binary
        run: |
          set -euo pipefail
          ./dist/tta version
          ./dist/tta module list
          ./dist/tta --help
          work="$(mktemp -d)"
          # Tiny English-text PDF so tokenize + readability are applicable.
          python tests/make_sample_pdf.py "$work/sample.pdf"
          ./dist/tta -C "$work" run "$work/sample.pdf" | tee run.log
          # The run must complete with no module errors (proves bundled
          # punkt_tab + migrations + fitz all work in the frozen binary).
          grep -Eq '0 errors' run.log

      # The manifest must be INSIDE each executable, not merely next to it on
      # the build machine (ADR-0014, #4). pyi-archive_viewer reads the real
      # CArchive out of the produced onefile binary, so this is evidence
      # about the shipped artefact rather than about the build tree.
      - name: Verify the licence manifest is inside both binaries
        run: |
          set -euo pipefail
          for exe in dist/tta dist/tta-gui; do
            if pyi-archive_viewer --list "$exe" \
                 | grep -q "'THIRD_PARTY_LICENSES.txt'"; then
              echo "$exe: licence manifest present"
            else
              echo "::error::$exe does not contain THIRD_PARTY_LICENSES.txt"
              exit 1
            fi
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tta-linux-x86_64
          path: |
            dist/tta
            dist/tta-gui
            build/licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
