name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    name: lint-and-test (linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: |
          pip install -e '.[dev]'
          python -m nltk.downloader punkt_tab

      # SDD §5.2 — hexagonal boundary invariant.
      # core/cli must not import the UI layer; core/ui must not import the CLI
      # layer. A match means the dependency direction was violated.
      # (No AGPL gate — retired by ADR-0017.)
      - name: Boundary invariant (SDD §5.2)
        run: |
          if grep -rn 'tta\.ui' tta/core tta/cli --include='*.py'; then
            echo "::error::tta.core/tta.cli must not import tta.ui (SDD §5.2)"
            exit 1
          fi
          if grep -rn 'tta\.cli' tta/core tta/ui --include='*.py'; then
            echo "::error::tta.core/tta.ui must not import tta.cli (SDD §5.2)"
            exit 1
          fi

      # ADR-0018 — Python source must be pure ASCII.
      - name: ASCII-source invariant (ADR-0018)
        run: |
          if git ls-files '*.py' | xargs grep -lP '[^\x00-\x7F]'; then
            echo "::error::non-ASCII byte found in tracked *.py (ADR-0018)"
            exit 1
          fi

      # GUI smoke test self-skips headless (no DISPLAY) — expected, no xvfb.
      - name: Run tests
        run: python -m pytest -q

  # Frozen release binaries (issue #4, ADR-0014). Linux only - NO mac/win
  # matrix. Builds the two --onefile executables from packaging/tta.spec and
  # uploads them as a workflow artifact. PyMuPDF may ship (ADR-0017).
  #
  # ADR-0014 clean-environment clause (#52): PYTHONNOUSERSITE=1 is set for
  # the WHOLE job, so the user site directory can never contribute to the
  # frozen binary. The first 212 MB release build picked up llvmlite (168 MB
  # uncompressed) and numba (10 MB) from the builder's ~/.local that way -
  # neither is a declared dependency. The spec refuses to build without it.
  build-linux:
    name: build-linux (onefile)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      PYTHONNOUSERSITE: "1"
      # ...and pip must not install *into* the user site either, or the
      # freeze would not find the dependencies it just installed.
      PIP_USER: "0"
      # ADR-0014 size gate: per-executable ceiling, in bytes (150 MB).
      # A regression tripwire, not a target. Raising it requires an ADR
      # revision with a measurement - the reflex on a failure is to look
      # for undeclared packages in build/tta/Analysis-*.toc first.
      TTA_MAX_EXE_BYTES: "157286400"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tkinter is not bundled with the actions/setup-python interpreter; the
      # GUI binary (tta.ui.tk) needs it present at freeze time.
      - name: Install Tk (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev

      # build extra = PyInstaller; pymupdf extra = the fitz extractor the
      # default module registry uses (ADR-0017 permits shipping it).
      - name: Install build dependencies
        run: pip install -e '.[build,pymupdf]'

      - name: Download NLTK punkt_tab (bundled into the binary)
        run: python -m nltk.downloader punkt_tab

      - name: Build onefile binaries
        run: pyinstaller packaging/tta.spec --noconfirm --distpath dist --workpath build

      # ADR-0014 build gates (#52): per-executable size ceiling, plus proof
      # that neither dependency graph carries the undeclared numeric stack,
      # that nothing was collected from a user site directory, and that the
      # CLI graph is free of the GUI-only stack. The logic lives in a
      # committed script so it is unit-tested by tests/packaging/.
      - name: Build gates (ADR-0014)
        run: |
          python packaging/check_build.py \
            --dist dist --build build/tta --max-bytes "$TTA_MAX_EXE_BYTES"

      # Headless CLI smoke test: prove the frozen binary boots, the bundled
      # SQL migrations run, and the NLTK-dependent modules succeed end to end
      # (issue #4). No DISPLAY here, so the GUI binary is not launched.
      - name: Smoke-test CLI binary
        run: |
          set -euo pipefail
          ./dist/tta version
          ./dist/tta module list
          ./dist/tta --help
          work="$(mktemp -d)"
          # Tiny English-text PDF so tokenize + readability are applicable.
          python tests/make_sample_pdf.py "$work/sample.pdf"
          ./dist/tta -C "$work" run "$work/sample.pdf" | tee run.log
          # The run must complete with no module errors (proves bundled
          # punkt_tab + migrations + fitz all work in the frozen binary).
          grep -Eq '0 errors' run.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tta-linux-x86_64
          path: |
            dist/tta
            dist/tta-gui
          if-no-files-found: error
