# The comment above each job and step below is the reference for what it is
# for (SDD 5.6.4); the SDD gives the overview and does not repeat it.
#
# Actions: GitHub's own JavaScript actions only, pinned to a major tag whose
# action.yml declares `runs.using: node24` (#35). Node 20 is deprecated on
# the runners: an action on a node20 major still runs, but forced onto
# Node 24 and with a warning on every job. Check `runs.using` and the release
# notes of a new major before bumping; tests/packaging rejects a node20 major.
name: CI

on:
  push:
    branches: ["**"]
    # Release trigger (issue #4, ADR-0014). A v* tag runs the same build
    # matrix as every other push and then opens a DRAFT release from it.
    tags: ["v*"]
  pull_request:
  # "Run workflow" button: the one non-tag run that uploads the binaries
  # (ADR-0014 revision 2026-10-12), e.g. to fetch a Windows .exe to test.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One leg per development platform (SDD §5.6.3): Linux, and native Windows,
  # where the GUI is mostly used. `label` keeps the Linux check's name
  # unchanged. Every step is the same script on both, through Git bash on
  # Windows - as in the build job.
  lint-and-test:
    name: lint-and-test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      # A Windows-only failure must not hide the Linux result, or vice versa.
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
          - label: windows
            os: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      # The pushed commit, and the CPython the binaries embed and the dev
      # env uses (SDD 5.6.3). No pip cache is configured, so every run
      # installs the declared dependencies afresh.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # python3-tk pulls in the libtcl/libtk shared objects the setup-python
      # interpreter's tkinter links against; xvfb gives the display-gated GUI
      # tests somewhere to draw (see the GUI step below). The Windows
      # interpreter ships Tcl/Tk, and Windows needs no virtual display.
      - name: Install Tk and Xvfb (system)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      # pytest-cov is installed here rather than declared in the dev extra:
      # it is a property of how CI measures the suite, not of the package.
      # pip-licenses (the build extra) comes along so tests/packaging can
      # exercise the real manifest generator instead of skipping it. The NLTK
      # data is what the modules load at run time (punkt_tab: sentences,
      # cmudict: English syllables for textstat).
      - name: Install package (dev extras + coverage)
        run: |
          pip install -e '.[dev,build]' 'pytest-cov>=5'
          python -m nltk.downloader punkt_tab cmudict

      # SDD §5.2 — hexagonal boundary invariant.
      # core/cli must not import the UI layer; core/ui must not import the CLI
      # layer. A match means the dependency direction was violated.
      # (No AGPL gate — retired by ADR-0017.)
      - name: Boundary invariant (SDD §5.2)
        run: |
          if grep -rn 'tta\.ui' tta/core tta/cli --include='*.py'; then
            echo "::error::tta.core/tta.cli must not import tta.ui (SDD §5.2)"
            exit 1
          fi
          if grep -rn 'tta\.cli' tta/core tta/ui --include='*.py'; then
            echo "::error::tta.core/tta.ui must not import tta.cli (SDD §5.2)"
            exit 1
          fi

      # ADR-0018 — Python source must be pure ASCII.
      # LC_ALL: grep -P refuses to run outside a UTF-8 or unibyte locale, and
      # Git bash on Windows starts in neither. Its error would read as "no
      # match" in the `if` below, so the gate would pass without checking.
      - name: ASCII-source invariant (ADR-0018)
        env:
          LC_ALL: C.UTF-8
        run: |
          if git ls-files '*.py' | xargs grep -lP '[^\x00-\x7F]'; then
            echo "::error::non-ASCII byte found in tracked *.py (ADR-0018)"
            exit 1
          fi

      # Includes the slow-marked tests (full pipeline, GUI smoke) - nothing
      # deselects them. On Linux the display-gated GUI tests self-skip here,
      # and the step after this one runs them for real under Xvfb; on Windows
      # they run here, against the runner's desktop session.
      #
      # Coverage gate (QA-TEST, SDD §10): 85 % line AND 70 % branch on
      # tta/core - two separate targets, which is why this cannot use
      # --cov-fail-under. That flag gates coverage.py's single COMBINED
      # line+branch rate, so it would fail a build that satisfies both stated
      # targets (line 86 %, branch 71 % combine to ~81 %) and pass one that
      # misses the branch target outright. The two numbers are therefore
      # checked separately, against the ones QA-TEST states.
      #
      # COVERAGE_FILE and the JSON report are written outside the checkout, so
      # a coverage run leaves the working tree clean.
      - name: Run tests (with the QA-TEST coverage gate)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          TTA_COV_LINE: "85"
          TTA_COV_BRANCH: "70"
        run: |
          set -euo pipefail
          python -m pytest -q \
            --cov=tta.core --cov-branch --cov-report=term-missing \
            --cov-report=json:"$RUNNER_TEMP/coverage.json"
          python - <<'PY'
          import json, os, sys

          totals = json.load(
              open(os.path.join(os.environ["RUNNER_TEMP"], "coverage.json"))
          )["totals"]
          line = 100.0 * totals["covered_lines"] / max(totals["num_statements"], 1)
          branch = 100.0 * totals["covered_branches"] / max(totals["num_branches"], 1)
          want_line = float(os.environ["TTA_COV_LINE"])
          want_branch = float(os.environ["TTA_COV_BRANCH"])
          print(
              "tta/core coverage: %.2f %% line (QA-TEST target %.0f %%), "
              "%.2f %% branch (target %.0f %%)"
              % (line, want_line, branch, want_branch)
          )
          short = []
          if line < want_line:
              short.append("line %.2f %% < %.0f %%" % (line, want_line))
          if branch < want_branch:
              short.append("branch %.2f %% < %.0f %%" % (branch, want_branch))
          if short:
              print("::error::QA-TEST coverage gate: " + "; ".join(short))
              sys.exit(1)
          PY

      # Without this the display-gated tests under tests/ui NEVER run in CI -
      # they self-skip, which reads as a pass. Issue #3 allows either, but a
      # permanently skipped test is untested code. Kept as its own step so an
      # Xvfb problem is instantly distinguishable from a real failure. Linux
      # only: the Windows leg already ran them in the step above.
      - name: GUI tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/ui -q

  # Frozen release binaries (issue #4, ADR-0014): one job per target OS, on
  # every push and pull request, so the release path is never first exercised
  # on tag day. PyMuPDF may ship (ADR-0017).
  #
  # ADR-0014 clean-environment clause (#52): PYTHONNOUSERSITE=1 is set for
  # the WHOLE job, so the user site directory can never contribute to the
  # frozen binary. The first 212 MB release build picked up llvmlite (168 MB
  # uncompressed) and numba (10 MB) from the builder's ~/.local that way -
  # neither is a declared dependency. The spec refuses to build without it.
  build:
    name: build ${{ matrix.target }} (onefile)
    needs: lint-and-test
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform's packaging failure must not hide the other three.
      fail-fast: false
      matrix:
        include:
          # ADR-0014 size gate, per target, in bytes (n MiB). All four are
          # measured (larger of CLI/GUI) plus ~41 % headroom - see the ADR's
          # ceiling table; raise one there, with a measurement, never here.
          - target: linux-x86_64
            os: ubuntu-latest
            exe_suffix: ""
            max_exe_bytes: "104857600"    # 100 MB, measured
          - target: windows-x86_64
            os: windows-latest
            exe_suffix: ".exe"
            max_exe_bytes: "73400320"     # 70 MB, measured 49.5 MiB
          - target: macos-arm64
            # macos-14 is no longer accepted (2026-11-17, ADR-0014).
            os: macos-15
            exe_suffix: ""
            max_exe_bytes: "78643200"     # 75 MB, measured 52.3 MiB
          # macos-13 is retired - its jobs queued until the run was
          # cancelled. macos-15-intel is the remaining Intel image (ADR-0014).
          - target: macos-x86_64
            os: macos-15-intel
            exe_suffix: ""
            max_exe_bytes: "80740352"     # 77 MB, measured 54.1 MiB

    env:
      PYTHONNOUSERSITE: "1"
      # ...and pip must not install *into* the user site either, or the
      # freeze would not find the dependencies it just installed.
      PIP_USER: "0"
      TTA_MAX_EXE_BYTES: ${{ matrix.max_exe_bytes }}
      EXE_SUFFIX: ${{ matrix.exe_suffix }}
      CLI_EXE: dist/tta${{ matrix.exe_suffix }}
      GUI_EXE: dist/tta-gui${{ matrix.exe_suffix }}

    defaults:
      run:
        # One shell for all four targets: every step below is the same script
        # everywhere, and Windows gets it through Git bash.
        shell: bash

    steps:
      # The pushed commit, and the CPython the binaries embed and the dev
      # env uses (SDD 5.6.3). No pip cache is configured, so every run
      # installs the declared dependencies afresh.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # tkinter is not bundled with the actions/setup-python interpreter on
      # Linux; the GUI binary (tta.ui.tk) needs it present at freeze time.
      # Xvfb is for the GUI launch check further down. The Windows and macOS
      # interpreters ship Tcl/Tk themselves.
      - name: Install Tk and Xvfb (system)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev xvfb

      # build extra = PyInstaller + pip-licenses. PyMuPDF (the fitz extractor
      # the default module registry uses, ADR-0017) is a regular dependency.
      - name: Install build dependencies
        run: pip install -e '.[build]'

      # Both are collected into the binary's nltk_data/ by the spec; a
      # missing cmudict made the binary download it at run time (#75).
      - name: Download NLTK data (punkt_tab, cmudict; bundled into the binary)
        run: python -m nltk.downloader punkt_tab cmudict

      # ADR-0014 licence manifest (#4). Must run BEFORE PyInstaller and in
      # this same clean environment: it inventories the installed
      # distributions, so its accuracy depends on PYTHONNOUSERSITE above.
      # The spec refuses to build if the file is absent.
      - name: Generate THIRD_PARTY_LICENSES.txt (ADR-0014)
        run: |
          python packaging/gen_third_party_licenses.py \
            --output build/licenses/THIRD_PARTY_LICENSES.txt

      # Both executables (tta, tta-gui) from the one spec. dist/ receives the
      # binaries; build/ keeps the Analysis TOCs the gates below inspect.
      - name: Build onefile binaries
        run: pyinstaller packaging/tta.spec --noconfirm --distpath dist --workpath build

      # ADR-0014 build gates (#52, #4): per-target size ceiling, plus proof
      # that neither dependency graph carries the undeclared numeric stack,
      # that nothing was collected from a user site directory, that the CLI
      # graph is free of the GUI-only stack while the GUI graph still HAS it,
      # and that every bundled distribution has a licence notice in the
      # manifest. The logic lives in a committed script so it is unit-tested
      # by tests/packaging/.
      - name: Build gates (ADR-0014)
        run: |
          python packaging/check_build.py \
            --dist dist --build build/tta --max-bytes "$TTA_MAX_EXE_BYTES" \
            --exe "tta$EXE_SUFFIX" --exe "tta-gui$EXE_SUFFIX" \
            --manifest build/licenses/THIRD_PARTY_LICENSES.txt

      # ADR-0014 packaged-binary acceptance (#4): launch -> add PDFs -> run ->
      # list -> export, driven against the frozen CLI on every target. This is
      # what proves the BUNDLED payload works rather than merely being
      # present: punkt_tab, the SQL migrations, the help markdown and PyMuPDF
      # extraction are all on this path. Written in Python rather than shell
      # because temp-directory paths handed to a native executable are the one
      # thing that does not survive Git bash on Windows unchanged.
      - name: Smoke-test the CLI binary (run -> list -> export)
        run: |
          python - <<'PY'
          import json, os, pathlib, sqlite3, subprocess, sys, tempfile

          exe = pathlib.Path(os.environ["CLI_EXE"]).resolve()

          def run(*args):
              print("$ %s %s" % (exe.name, " ".join(args)), flush=True)
              proc = subprocess.run([str(exe), *args], capture_output=True,
                                    text=True)
              sys.stdout.write(proc.stdout)
              sys.stderr.write(proc.stderr)
              if proc.returncode != 0:
                  sys.exit("FAILED (rc=%d): %s"
                           % (proc.returncode, " ".join(args)))
              return proc.stdout

          run("version")
          run("module", "list")
          run("--help")

          work = pathlib.Path(tempfile.mkdtemp(prefix="tta-smoke-"))
          sample = work / "sample.pdf"
          subprocess.run([sys.executable, "tests/make_sample_pdf.py",
                          str(sample)], check=True)

          # A real run: bundled punkt_tab + migrations + fitz all have to work.
          # JSON, not the summary line: that one is localised (German by
          # default, ADR-0020), so an English text match never succeeds.
          summary = json.loads(run("-C", str(work), "run", "--format", "json",
                                   str(sample)))
          if summary["error"] != 0 or summary["ok"] < 1:
              sys.exit("FAILED: the frozen binary reported module errors")

          rows = json.loads(run("-C", str(work), "list", "--format", "json"))
          if not rows or rows[0]["ok"] < 1:
              sys.exit("FAILED: no successful module runs recorded")

          export = work / "export.sqlite"
          run("-C", str(work), "export", str(export))
          if not export.is_file() or export.stat().st_size == 0:
              sys.exit("FAILED: export produced no file")
          with sqlite3.connect(export) as conn:
              metrics = conn.execute(
                  "SELECT count(*) FROM metric_values"
              ).fetchone()[0]
          if metrics < 1:
              sys.exit("FAILED: the export carries no metric values")
          print("CLI smoke OK: %d thesis/theses, %d metric values exported"
                % (len(rows), metrics))
          PY

      # ADR-0014 packaged-binary acceptance (#4), GUI half. The CLI binary no
      # longer carries Tk/tksheet/matplotlib at all, so nothing else in this
      # pipeline would notice if the GUI's own stack failed to survive
      # freezing. It must come up and STAY up (the timeout kills it -> rc 124)
      # and it must have created its default project. HOME is redirected so
      # the check cannot depend on, or pollute, the runner's home.
      # Linux only: the Windows and macOS runners have no Xvfb equivalent.
      - name: Launch the GUI binary under Xvfb
        if: runner.os == 'Linux'
        run: |
          set -uo pipefail
          export HOME="$RUNNER_TEMP/guihome"
          mkdir -p "$HOME"
          log="$RUNNER_TEMP/gui.log"
          # `|| rc=$?`, not a bare `rc=$?`: the job shell is `bash -e`, so the
          # 124 that means "stayed up" would otherwise abort the step.
          rc=0
          xvfb-run -a timeout -s TERM 30 "./$GUI_EXE" > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 124 ]; then
            echo "::error::$GUI_EXE exited with $rc instead of staying up - the frozen Tk/tksheet/matplotlib stack did not survive freezing"
            exit 1
          fi
          if [ ! -f "$HOME/TTA-Theses/tta.sqlite" ]; then
            echo "::error::$GUI_EXE never created its default project (ADR-0014 first-launch behaviour)"
            exit 1
          fi
          echo "GUI binary launched, stayed up for 30 s, created its project"

      # The manifest must be INSIDE each executable, not merely next to it on
      # the build machine (ADR-0014, #4). pyi-archive_viewer reads the real
      # CArchive out of the produced onefile binary, so this is evidence
      # about the shipped artefact rather than about the build tree.
      - name: Verify the licence manifest is inside both binaries
        run: |
          set -euo pipefail
          for exe in "$CLI_EXE" "$GUI_EXE"; do
            # The listing is captured BEFORE it is searched, deliberately:
            # `pyi-archive_viewer --list | grep -q` exits grep on the first
            # match, the viewer dies of SIGPIPE, and `pipefail` then fails
            # this step precisely when the manifest IS present. Verified.
            listing="$(pyi-archive_viewer --list "$exe")"
            if grep -q "'THIRD_PARTY_LICENSES.txt'" <<<"$listing"; then
              echo "$exe: licence manifest present"
            else
              echo "::error::$exe does not contain THIRD_PARTY_LICENSES.txt"
              exit 1
            fi
          done

      # Tags (the release job collects these) and manual runs only: the repo
      # is private, and four targets per push exceed the Actions storage
      # quota (ADR-0014 revision 2026-10-12). Every push still builds and
      # smoke-tests all four above.
      # GUI only: the frozen CLI exists for the smoke above, its users run it
      # from source (ADR-0003 / ADR-0014 revisions 2026-10-12).
      - name: Upload binaries
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: tta-${{ matrix.target }}
          path: |
            dist/tta-gui${{ matrix.exe_suffix }}
            build/licenses/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # Tagged release (issue #4, ADR-0014). Collects the four targets' artefacts
  # and opens a DRAFT release: publishing needs the #8 licence sign-off, a
  # human decision, not CI's. (#6, the GDPR statement, is finalised.)
  release:
    name: draft release (v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # No checkout: nothing here reads the source. The artefacts come from
    # the build job and `gh` takes the repository from GH_REPO below.
    steps:
      # No `name`: every artefact of this run, one directory per target
      # (artifacts/tta-<target>/).
      - name: Download every target's artefact
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The artefacts all carry the same file names, so flatten them into one
      # directory with the target in the name - that is what somebody
      # downloading a single binary from the release page needs to see.
      # `find`, not a `$dir*` glob: upload-artifact roots an artefact at the
      # least common ancestor of its paths, which for dist/ + build/licenses/
      # is the checkout, so each artefact holds dist/tta-gui[.exe] and
      # build/licenses/THIRD_PARTY_LICENSES.txt, not two top-level files.
      # The glob saw the two directories and `cp` failed on them (#35).
      - name: Collect the release assets
        run: |
          set -euo pipefail
          mkdir -p upload
          for dir in artifacts/*/; do
            target="$(basename "$dir")"      # tta-linux-x86_64
            target="${target#tta-}"          # linux-x86_64
            find "$dir" -type f -print0 | while IFS= read -r -d '' path; do
              name="$(basename "$path")"
              case "$name" in
                THIRD_PARTY_LICENSES.txt)
                  out="THIRD_PARTY_LICENSES-$target.txt" ;;
                *.exe)
                  out="${name%.exe}-$target.exe" ;;
                *)
                  out="$name-$target" ;;
              esac
              cp "$path" "upload/$out"
            done
          done
          ls -l upload

      # Draft only; the release notes state why. GH_REPO stands in for the
      # git remote `gh` would otherwise read from a checkout.
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" upload/* \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "Unsigned single-file GUI binaries per ADR-0014 (the tta CLI is used from source) (SmartScreen: More info -> Run anyway; Gatekeeper: right-click -> Open). Each binary bundles its THIRD_PARTY_LICENSES.txt, also attached per target. Draft on purpose: publishing needs the LICENSE sign-off (#8). The GDPR statement (Help -> Privacy statement) was finalised in #6 (ADR-0009)."
